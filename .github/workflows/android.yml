name: Build and test Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Create Android project
        shell: bash
        run: |
          mkdir -p app/src/main/java/com/localstudy/tbmquizshell
          mkdir -p app/src/main/res/values

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "TBMQuizShell"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
          android.useAndroidX=false
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.localstudy.tbmquizshell'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.localstudy.tbmquizshell'
                  minSdk 26
                  targetSdk 35
                  versionCode 200
                  versionName '2.0'
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:allowBackup="true"
                  android:label="TBM刷题测试壳"
                  android:theme="@style/AppTheme">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/java/com/localstudy/tbmquizshell/MainActivity.java <<'EOF'
          package com.localstudy.tbmquizshell;

          import android.app.Activity;
          import android.os.Bundle;
          import android.graphics.Color;
          import android.view.Gravity;
          import android.view.ViewGroup;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.TextView;
          import android.content.SharedPreferences;

          public class MainActivity extends Activity {

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  SharedPreferences prefs =
                          getSharedPreferences("tbm_shell", MODE_PRIVATE);

                  int count = prefs.getInt("open_count", 0) + 1;

                  prefs.edit()
                          .putInt("open_count", count)
                          .apply();

                  float d = getResources()
                          .getDisplayMetrics()
                          .density;

                  int pad = (int)(24 * d);

                  LinearLayout root =
                          new LinearLayout(this);

                  root.setOrientation(
                          LinearLayout.VERTICAL);

                  root.setGravity(
                          Gravity.CENTER_HORIZONTAL);

                  root.setPadding(
                          pad,
                          pad * 2,
                          pad,
                          pad);

                  root.setBackgroundColor(
                          Color.rgb(247,248,250));

                  TextView title =
                          new TextView(this);

                  title.setText(
                          "TBM 标准化刷题");

                  title.setTextSize(28);
                  title.setGravity(Gravity.CENTER);

                  root.addView(title);

                  TextView status =
                          new TextView(this);

                  status.setText(
                          "\n标准 Android APK 已成功启动\n\n"
                          + "这是干净测试版本。\n"
                          + "暂时不含 PPT、题库和现场照片。\n\n"
                          + "本机累计启动："
                          + count
                          + " 次");

                  status.setTextSize(18);
                  status.setGravity(Gravity.CENTER);

                  root.addView(status);

                  Button button =
                          new Button(this);

                  button.setText("测试按钮");

                  button.setOnClickListener(
                          v -> button.setText(
                                  "按钮正常 ✓"));

                  LinearLayout.LayoutParams params =
                          new LinearLayout.LayoutParams(
                                  ViewGroup.LayoutParams.MATCH_PARENT,
                                  ViewGroup.LayoutParams.WRAP_CONTENT);

                  params.topMargin = pad;

                  root.addView(
                          button,
                          params);

                  TextView next =
                          new TextView(this);

                  next.setText(
                          "\n这个版本通过后再加入：\n"
                          + "选择题 → 填空题 → PPT出处 → "
                          + "现场核验 → 拍照记录");

                  next.setTextSize(16);
                  next.setGravity(Gravity.CENTER);

                  root.addView(next);

                  setContentView(root);
              }
          }
          EOF

      - name: Build APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Check APK exists
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Test install and launch in emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -n com.localstudy.tbmquizshell/.MainActivity
            sleep 5
            adb shell pidof com.localstudy.tbmquizshell
            adb shell am force-stop com.localstudy.tbmquizshell
            adb shell am start -n com.localstudy.tbmquizshell/.MainActivity
            sleep 3
            adb shell pidof com.localstudy.tbmquizshell

      - name: Rename tested APK
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk tbm_quiz_shell_tested.apk

      - name: Upload tested APK
        uses: actions/upload-artifact@v4
        with:
          name: tbm-quiz-shell-tested
          path: tbm_quiz_shell_tested.apk
