name: Build TBM Quiz APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'tbm_app_source.zip'
      - '.github/workflows/android.yml'

permissions:
  contents: write

jobs:
  build-test-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Check source package
        run: |
          test -f tbm_app_source.zip
          unzip -t tbm_app_source.zip

      - name: Extract Android source
        run: |
          unzip -oq tbm_app_source.zip -d .
          test -f settings.gradle
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/com/localstudy/tbmquiz/MainActivity.java
          test -f app/src/main/assets/index.html
          test -f app/src/main/assets/data.js

      - name: Build signed release APK
        run: gradle :app:assembleRelease --stacktrace

      - name: Verify APK structure and signature
        shell: bash
        run: |
          APK='app/build/outputs/apk/release/app-release.apk'
          test -f "$APK"
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          echo "Using build-tools: $BUILD_TOOLS"
          "$BUILD_TOOLS/aapt" dump badging "$APK" | tee apk_badging.txt
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK" | tee apk_signature.txt
          grep -q "package: name='com.localstudy.tbmquiz'" apk_badging.txt
          cp "$APK" TBM_Quiz_v3.apk

      - name: Install and launch on Android 34 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          script: |
            set -e
            adb install -r TBM_Quiz_v3.apk
            adb shell pm grant com.localstudy.tbmquiz android.permission.CAMERA || true
            adb logcat -c
            adb shell am start -W -n com.localstudy.tbmquiz/.MainActivity
            sleep 6
            PID="$(adb shell pidof com.localstudy.tbmquiz | tr -d '\r')"
            echo "PID=$PID"
            test -n "$PID"
            adb shell am force-stop com.localstudy.tbmquiz
            adb shell am start -W -n com.localstudy.tbmquiz/.MainActivity
            sleep 4
            PID2="$(adb shell pidof com.localstudy.tbmquiz | tr -d '\r')"
            echo "PID2=$PID2"
            test -n "$PID2"
            adb logcat -d -v time | grep -E "AndroidRuntime|FATAL EXCEPTION|com.localstudy.tbmquiz" | tail -200 > launch_log.txt || true
            ! grep -q "FATAL EXCEPTION" launch_log.txt

      - name: Upload APK artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TBM-Quiz-v3-APK
          path: |
            TBM_Quiz_v3.apk
            apk_badging.txt
            apk_signature.txt
            launch_log.txt
          if-no-files-found: warn

      - name: Publish direct APK release
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="tbm-v3-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" TBM_Quiz_v3.apk \
            --target "$GITHUB_SHA" \
            --title "TBM标准化刷题 v3（已通过模拟器安装启动测试）" \
            --notes "基于最新PDF题库构建。已完成标准Android编译、APK结构/签名校验、Android 34模拟器安装与两次启动测试。下载 TBM_Quiz_v3.apk 直接安装。"
